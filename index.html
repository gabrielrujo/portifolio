<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Título, descrição e Open Graph vêm de src/config.js (export `site`), via vite.config.js -->
    <title>__SITE_TITLE__</title>
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="__SITE_LOCALE__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="__SITE_TITLE__" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:image" content="__SITE_URL____SITE_OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SITE_TITLE__" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050608" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes da primeira pintura (evita piscar). Padrão: preferência do sistema.
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var dark = stored === "dark" || ((!stored || stored === "system") && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
